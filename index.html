<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great Warrior Gig Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one full-screen stage. The arena canvas fills it, a thin HUD rides the top and bottom edges, and every between-room screen is a centered panel over the arena. Single dark "stage lights" look, shared with the Sound Lab. */
:root {
  color-scheme: dark;
  --ground: #100e18;
  --panel: #1a1726;
  --panel-2: #221e32;
  --line: #2f2a44;
  --ink: #efeaf9;
  --mute: #9a92b6;
  --hot: #ff5c8a;
  --gold: #ffd166;
  --ok: #5ee0a0;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.hud.top { top: 0; padding-block: 10px 0; }
.hud.bottom { bottom: 0; padding-block: 0 10px; align-items: flex-end; }
.hud > * { pointer-events: auto; }
.box { background: rgba(16,14,24,.82); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: .82rem; }
.hp { display: grid; gap: 4px; min-width: 170px; }
.hp .row { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: .74rem; color: var(--mute); }
.hp .row b { color: var(--ink); font-weight: 500; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--hot), #ff8fae); transition: width .15s; }
.bar.xp i { background: linear-gradient(90deg, var(--gold), #ffe3a3); }
.bar.boss i { background: linear-gradient(90deg, #b18cff, var(--hot)); }
.mid { display: grid; gap: 4px; justify-items: center; text-align: center; }
.mid .room { font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; font-size: .9rem; }
.map { display: flex; gap: 4px; }
.map i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); font-style: normal; font-family: var(--f-mono); font-size: 9px; line-height: 12px; text-align: center; color: var(--mute); }
.map i.done { background: var(--line); color: var(--ink); }
.map i.now { border-color: var(--gold); color: var(--gold); }
.map i.boss { border-color: #6b2f42; }
.right { display: grid; gap: 6px; justify-items: end; }
.pill { white-space: nowrap; font-family: var(--f-mono); font-size: .76rem; background: rgba(10,8,18,.8); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.pill.pilot { border-color: var(--hot); color: var(--hot); }
.pill.queued { border-style: dashed; }
.pill.inv { border-color: var(--gold); color: var(--gold); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { border-color: #4a4268; }
.btn kbd { font-family: var(--f-mono); font-size: .68rem; opacity: .65; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.btn.special { border-color: var(--gold); color: var(--gold); padding: 6px 12px; font-size: .82rem; }
.btn.special:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); color: var(--mute); }
.btn.special.live { background: var(--gold); color: #1a1405; }
.btn.small { padding: 6px 10px; font-size: .8rem; }
.loadout { display: flex; flex-wrap: wrap; gap: 6px; max-width: min(760px, 100%); }
.chip { --c: #888; display: flex; align-items: center; gap: 6px; background: rgba(16,14,24,.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .76rem; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font-weight: 600; }
.chip span { font-family: var(--f-mono); color: var(--mute); font-size: .68rem; }
.chip.on { border-color: var(--c); }
.chip.queued i, .chip.leaving i { animation: flick .5s steps(2) infinite; }
.chip.dropped { border-color: #6b2f42; }
.chip.dropped i { background: var(--hot); animation: flick .2s steps(2) infinite; }
.chip.gear { border-style: dashed; }
.chip.empty { color: var(--mute); border-style: dashed; }
.pips { display: flex; gap: 4px; align-items: center; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }
.pips i.on.down { background: var(--hot); }
.touchpad { display: none; gap: 8px; }
@media (pointer: coarse) { .touchpad { display: flex; } }
@keyframes flick { 50% { opacity: .1; } }
.banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 700; font-size: clamp(1.2rem, 4vw, 2rem); letter-spacing: .05em; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 0 18px rgba(255,92,138,.6); max-width: calc(100% - 32px); }
.banner.show { opacity: 1; }
.banner small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .9rem; color: var(--mute); text-shadow: none; letter-spacing: 0; }

/* Screens */
.screen { position: absolute; inset: 0; display: grid; place-items: center; overflow-y: auto; background: rgba(10,8,18,.72); backdrop-filter: blur(2px);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { width: min(920px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.panel h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.panel h1 span { color: var(--gold); }
.panel h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.panel h3 { font-family: var(--f-display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0; }
.panel p { margin: 0; color: var(--mute); max-width: 68ch; }
.panel p b { color: var(--ink); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.cols > * { min-width: 0; }
.stat { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--f-mono); font-size: .8rem; color: var(--mute); }
.stat b { color: var(--ink); font-weight: 500; }
.list { display: grid; gap: 6px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2); }
.item > div { min-width: 0; }
.item b { font-family: var(--f-display); font-size: .92rem; display: block; }
.item span { font-size: .78rem; color: var(--mute); display: block; }
.item.own { border-color: #2f5c48; }
.item.ban { border-color: #6b2f42; }
.item .btn { flex: none; }
.perks { display: grid; gap: 4px; font-size: .82rem; color: var(--mute); }
.perks .got { color: var(--ink); }
.perks .got::before { content: "■ "; color: var(--gold); }
.perks .next::before { content: "□ "; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.card { --c: #888; all: unset; box-sizing: border-box; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card:hover, .card:focus-visible { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 22px -8px var(--c); }
.card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card .tag { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .08em; color: var(--c); border: 1px solid var(--c); border-radius: 5px; padding: 1px 6px; justify-self: start; }
.card b { font-family: var(--f-display); font-size: 1.15rem; }
.card .music { font-size: .85rem; color: var(--ink); }
.card .fx { font-size: .82rem; color: var(--mute); }
.card .warn { font-size: .78rem; color: var(--hot); }
.card .slot { font-family: var(--f-mono); font-size: .7rem; color: var(--mute); }
.card kbd { font-family: var(--f-mono); font-size: .68rem; color: var(--mute); justify-self: end; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: .86rem; color: var(--mute); }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.keys { font-size: .82rem; color: var(--mute); display: grid; gap: 3px; }
.keys kbd { font-family: var(--f-mono); font-size: .7rem; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.summary-big { font-family: var(--f-display); font-size: 2rem; font-weight: 700; color: var(--gold); }
.lvup { color: var(--gold); font-weight: 600; }
@media (max-width: 560px) {
  .hp { min-width: 130px; }
  .map i { width: 11px; height: 11px; font-size: 0; }
  .chip span { display: none; }
  .chip.empty { display: none; }
  .hud.top { flex-wrap: nowrap; gap: 6px; }
  .hud.top .hp { min-width: 0; flex: 1 1 0; }
  .mid { flex: none; }
  .mid .map { display: none; }
  .mid .room { font-size: .78rem; }
  .btn.special { padding: 4px 8px; font-size: .72rem; }
  .pill { font-size: .68rem; padding: 3px 8px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .chip i { animation: none !important; } }
</style>

<div id="app">
  <canvas id="cv" aria-label="Arena"></canvas>

  <div class="hud top" id="hudTop" hidden>
    <div class="box hp">
      <div class="row"><span>Hull</span><b id="hpTxt">100 / 100</b></div>
      <div class="bar"><i id="hpBar"></i></div>
      <div class="row"><span id="shieldTxt">Shield none</span><span id="layerTxt">Layers 0 / 3</span></div>
    </div>
    <div class="box mid">
      <span class="room" id="roomTxt">Room 1 · Act I</span>
      <div class="map" id="map"></div>
      <div class="bar boss" id="bossWrap" hidden style="width:220px;max-width:50vw"><i id="bossBar"></i></div>
    </div>
    <div class="right">
      <span class="pill" id="modePill">Autopilot · 60%</span>
      <button class="btn special" id="specialBtn" type="button" disabled>Shred special <kbd>X</kbd></button>
    </div>
  </div>

  <div class="hud bottom" id="hudBot" hidden>
    <div class="loadout" id="loadout"></div>
    <div class="right">
      <div class="touchpad"><button class="btn small" id="dashBtn" type="button">Dash</button><button class="btn small" id="pauseBtn" type="button">Pause</button></div>
      <div class="box pips" id="pips"><i></i><i></i><i></i><i></i><span id="chordTxt" style="font-family:var(--f-mono);font-size:.74rem;color:var(--gold);margin-left:4px">Am</span></div>
    </div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="screen" id="screen"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
(() => {
"use strict";
// ===== Music data, gear sets and synth graph: carried over from the Sound Lab (v6 sets engine) =====
const STEPS = 128;             // 8 bars of 16th notes
const BAR = 16;
// Chord table: Am | F | C | G, repeated for 8 bars
const CH = [
  { name: "Am", bass: ["A1","A2","E2"], pad: ["A3","C4","E4"], choir: ["E4","A4","C5"], arp: ["A4","C5","E5","A5"], str: ["A3","A4","E4","A4"], wob: "A1" },
  { name: "F",  bass: ["F1","F2","C2"], pad: ["A3","C4","F4"], choir: ["F4","A4","C5"], arp: ["F4","A4","C5","F5"], str: ["F3","F4","C4","F4"], wob: "F1" },
  { name: "C",  bass: ["C2","C3","G2"], pad: ["G3","C4","E4"], choir: ["E4","G4","C5"], arp: ["G4","C5","E5","G5"], str: ["C4","C5","G4","C5"], wob: "C2" },
  { name: "G",  bass: ["G1","G2","D2"], pad: ["G3","B3","D4"], choir: ["D4","G4","B4"], arp: ["G4","B4","D5","G5"], str: ["G3","G4","D4","G4"], wob: "G1" },
];
const chordAt = step => CH[Math.floor(step / BAR) % 4];
const s16 = () => Tone.Time("16n").toSeconds();
const beatSec = () => Tone.Time("4n").toSeconds();

// Flute melody: [step, note, lengthInSteps]
const MELODY = [
  [0,"E5",2],[2,"A5",2],[4,"C6",3],[7,"B5",1],[8,"A5",4],[12,"E5",4],
  [16,"F5",2],[18,"A5",2],[20,"C6",4],[24,"D6",2],[26,"C6",2],[28,"A5",4],
  [32,"G5",2],[34,"C6",2],[36,"E6",4],[40,"D6",2],[42,"C6",2],[44,"G5",4],
  [48,"B5",3],[51,"A5",1],[52,"G5",2],[54,"D5",2],[56,"G5",6],
  [64,"E5",2],[66,"A5",2],[68,"C6",3],[71,"B5",1],[72,"A5",2],[74,"C6",2],[76,"E6",4],
  [80,"F6",3],[83,"E6",1],[84,"C6",4],[88,"A5",4],[92,"C6",4],
  [96,"E6",2],[98,"D6",2],[100,"C6",2],[102,"G5",2],[104,"E5",4],[108,"G5",4],
  [112,"B5",4],[116,"D6",4],[120,"B5",2],[122,"G5",2],[124,"A5",4],
];
const MEL = new Map(MELODY.map(m => [m[0], m]));
// Taiko: 2-bar pattern [stepIn32, velocity, isRim]
const TAIKO = new Map([[0,[1,0]],[3,[.45,0]],[6,[.6,0]],[8,[.9,0]],[12,[.5,1]],[14,[.6,1]],[16,[1,0]],[19,[.45,0]],[22,[.6,0]],[24,[.8,0]],[26,[.55,0]],[28,[.7,0]],[29,[.5,1]],[30,[.85,0]],[31,[.6,1]]]);
// Funk bass per bar: [step, which(0 root,1 octave,2 fifth), len, vel]
const FUNK = new Map([[0,[0,2,1]],[3,[0,1,.7]],[4,[1,1,.5]],[6,[0,1,.8]],[7,[1,1,.6]],[10,[0,2,.9]],[12,[2,1,.7]],[14,[1,1,.75]],[15,[0,1,.5]]]);
// Wobble rates (cycles per beat), one row per bar
const WOB_RATES = [[2,2,4,8],[3,3,2,1],[2,4,2,6],[1,2,4,8]];
const ARP_ORDER = [0,1,2,3,2,1,2,3];

// ================= Gear sets: one reusable engine =================
// A set = 5 armor pieces (one per body slot) + weapons that use the Rig's hands, covering 7 members.
// Each equipped piece plays its member right away, scaled by how much of the set is on:
//   loose (1-3 members, autopilot): sparse parts behind a muffled filter
//   tight (4+ members, or piloting): parts lock together, filter opens
//   full  (all 7 + Pilot mode): set bonus, lead vocal, everything else ducks under
// A full set unlocks its special: the two-handed weapon gives a solo, the two one-handed weapons a duel.
// To add a set: call defineSet() with pieces, build(out) returning instruments, play(I, x) per 16th step,
// and special.line(soloBar, chord) returning { notes: [midi...], sub: 1 | 2 }.
const BODY = {
  head:  { label: "Head",     parts: ["head"] },
  back:  { label: "Back",     parts: ["cape"] },
  arms:  { label: "Forearms", parts: ["foreR", "foreL"] },
  waist: { label: "Waist",    parts: ["waist"] },
  legs:  { label: "Legs",     parts: ["shinR", "shinL"] },
};
const SET_SIZE = 7;
const SETS = {};
const PIECE = {};
function defineSet(def) { SETS[def.id] = def; for (const p of def.pieces) { p.set = def.id; PIECE[p.id] = p; } }
const pieceById = id => PIECE[id];
const equipped = new Set();
const gearOrder = {}, gearHand = {};
const membersOf = setId => new Set([...equipped].filter(id => PIECE[id].set === setId).flatMap(id => PIECE[id].covers));
const RT = {};            // per-set runtime: bus, filter, instruments
let setNow = {};          // per-set member snapshot taken on each bar line
let fullSet = null;       // set whose full bonus is active
let setEntry = false;
let pilotNow = false;
const up12 = n => Tone.Frequency(n).transpose(12).toNote();
const melody = rows => new Map(rows.map(r => [r[0], r]));
const VOWEL = { a: [800, 1150, 2900], o: [450, 800, 2830], u: [320, 870, 2240], sop: [950, 1450, 3000] };
function mkFormant(input, vowel, out, qs = [5, 6, 8]) {
  return vowel.map((f, i) => { const bp = new Tone.Filter({ type: "bandpass", frequency: f, Q: qs[i] }); const g = new Tone.Gain([1, 0.5, 0.22][i]); input.connect(bp); bp.connect(g); g.connect(out); return bp; });
}
function mkVoice(dest, o) {
  const pan = new Tone.Panner(0);
  const vib = new Tone.Vibrato(o.vibF || 6, o.vibD || 0.03);
  const fx = new Tone.FeedbackDelay({ delayTime: o.delay || "16n", feedback: 0.2, wet: o.wet ?? 0.15 });
  const lp = new Tone.Filter({ type: "lowpass", frequency: o.lp || 6000 });
  const pre = o.dist ? [new Tone.Distortion({ distortion: o.dist, oversample: "2x" })] : [];
  const syn = new Tone.Synth({ oscillator: { type: o.osc || "sawtooth" }, envelope: o.env || { attack: 0.002, decay: 0.08, sustain: 0.7, release: 0.05 }, portamento: o.port ?? 0.006 });
  syn.chain(...pre, lp, vib, fx, pan, dest);
  syn.volume.value = o.vol ?? -9;
  return { syn, pan, vib };
}
const mid = n => Tone.Frequency(n).toMidi();
const AMIN = (() => { const pcs = [9, 11, 0, 2, 4, 5, 7], out = []; for (let m = 40; m <= 100; m++) if (pcs.includes(m % 12)) out.push(m); return out; })();
const idxOf = m => { let i = AMIN.findIndex(x => x >= m); return i < 0 ? AMIN.length - 1 : i; };
const sc = i => AMIN[Math.max(0, Math.min(AMIN.length - 1, i))];
const triOf = c => c.arp.slice(0, 3).map(mid);

// ---------------- Power Metal ----------------
const PC = { Am: ["A2","E3","A3"], F: ["F2","C3","F3"], C: ["C3","G3","C4"], G: ["G2","D3","G3"] };
const GALLOP = new Set([0,2,3,4,6,7,8,10,11,12,14,15]);
const SWEEP = [0,1,2,3,4,5,6,5,4,3,2,1,2,3,4,5];
const RUN = (() => { const out = []; let m = 93; const steps = [2,2,1,2,2,1,2]; for (let i = 0; i < 32; i++) { out.push(Tone.Frequency(m, "midi").toNote()); m -= steps[i % 7]; } return out; })();
const PM_VOX = melody([
  [0,"E4",4,"o"],[4,"A4",4,"a"],[8,"C5",4,"o"],[12,"B4",4,"a"],
  [16,"A4",6,"o"],[22,"G4",2,"a"],[24,"F4",4,"o"],[28,"A4",4,"a"],
  [32,"G4",4,"o"],[36,"E4",4,"a"],[40,"C4",4,"o"],[44,"E4",4,"a"],
  [48,"D4",6,"o"],[54,"E4",2,"a"],[56,"G4",4,"o"],[60,"B4",4,"a"],
  [64,"A4",2,"o"],[66,"C5",2,"a"],[68,"E5",12,"a"],
  [80,"D5",4,"o"],[84,"C5",4,"a"],[88,"A4",8,"o"],
  [96,"G4",4,"o"],[100,"C5",4,"a"],[104,"E5",8,"a"],
  [112,"D5",8,"o"],[120,"B4",4,"a"],[124,"G4",4,"o"],
]);
defineSet({
  id: "pm", name: "Power Metal", color: "#ff5c8a", key: "M",
  loose: "Loose: sparse and muffled", tight: "Locked in: the band plays one gallop together",
  pieces: [
    { id: "pm-greaves", body: "legs",  covers: ["drums"],  item: "Thunderstep Greaves", member: "Drummer",        adds: "double-kick" },
    { id: "pm-girdle",  body: "waist", covers: ["bass"],   item: "Low-End Girdle",      member: "Bassist",        adds: "metal bass" },
    { id: "pm-bracers", body: "arms",  covers: ["keys"],   item: "Keytar Bracers",      member: "Keyboardist",    adds: "synth stabs" },

const KEYMAP = { KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down", KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right" };

function toWorld(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left - view.ox) / view.s, y: (cy - r.top - view.oy) / view.s }; }
cv.addEventListener("mousemove", e => { const w = toWorld(e.clientX, e.clientY); mouse.x = w.x; mouse.y = w.y; mouse.t = performance.now(); mouse.inside = true; });

cv.addEventListener("touchmove", e => { if (!joy) return; for (const t of e.changedTouches) if (t.identifier === joy.id) { const dx = t.clientX - joy.x0, dy = t.clientY - joy.y0, L = Math.hypot(dx, dy); if (L > 6) { const k = Math.min(L, 56) / L / 56; joy.dx = dx * k; joy.dy = dy * k; markInput(); } else { joy.dx = 0; joy.dy = 0; } } e.preventDefault(); }, { passive: false });

// ---------- Main loop ----------
let last = performance.now();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great Warrior Gig Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one full-screen stage. The arena canvas fills it, a thin HUD rides the top and bottom edges, and every between-room screen is a centered panel over the arena. Single dark "stage lights" look, shared with the Sound Lab. */
:root {
  color-scheme: dark;
  --ground: #100e18;
  --panel: #1a1726;
  --panel-2: #221e32;
  --line: #2f2a44;
  --ink: #efeaf9;
  --mute: #9a92b6;
  --hot: #ff5c8a;
  --gold: #ffd166;
  --ok: #5ee0a0;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.hud.top { top: 0; padding-block: 10px 0; }
.hud.bottom { bottom: 0; padding-block: 0 10px; align-items: flex-end; }
.hud > * { pointer-events: auto; }
.box { background: rgba(16,14,24,.82); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: .82rem; }
.hp { display: grid; gap: 5px; min-width: 260px; padding: 8px 12px; }
.hp .bar { height: 12px; border-radius: 6px; }
.hud.top { display: grid; grid-template-columns: 1fr auto 1fr; }
.hud.top .right { justify-self: end; }
.hud.bottom .left { display: grid; gap: 8px; justify-items: start; }
.hp .row { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: .74rem; color: var(--mute); }
.hp .row b { color: var(--ink); font-weight: 500; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--hot), #ff8fae); transition: width .15s; }
.bar.xp i { background: linear-gradient(90deg, var(--gold), #ffe3a3); }
.bar.boss i { background: linear-gradient(90deg, #b18cff, var(--hot)); }
.bosshud { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); pointer-events: none; display: grid; gap: 4px; text-shadow: 0 1px 3px #000; }
.bosshud .row { display: flex; gap: 10px; align-items: baseline; font-size: .8rem; color: var(--mute); }
.bosshud .row b { font-family: var(--f-display); font-size: 1.05rem; color: var(--ink); letter-spacing: .04em; }
.bosshud .row span:last-child { margin-left: auto; font-family: var(--f-mono); font-size: .72rem; }
.bosshud .bbar { position: relative; height: 12px; background: rgba(16,14,24,.85); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bosshud .bbar i { display: block; height: 100%; width: 100%; background: var(--bc, linear-gradient(90deg, #b18cff, var(--hot))); transition: width .15s; }
.bosshud .bbar s { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.7); text-decoration: none; }
.bosshud.final .bbar i { background: #ffffff; animation: bosspulse .5s ease-in-out infinite alternate; }
@keyframes bosspulse { from { opacity: .4; } to { opacity: 1; } }
@media (max-width: 640px) { .bosshud { top: 118px; } }
.mid { display: grid; gap: 4px; justify-items: center; text-align: center; }
.mid .room { font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; font-size: .9rem; }
.map { display: flex; gap: 4px; }
.map i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); font-style: normal; font-family: var(--f-mono); font-size: 9px; line-height: 12px; text-align: center; color: var(--mute); }
.map i.done { background: var(--line); color: var(--ink); }
.map i.now { border-color: var(--gold); color: var(--gold); }
.map i.boss { border-color: #6b2f42; }
.right { display: grid; gap: 6px; justify-items: end; }
.pill { white-space: nowrap; font-family: var(--f-mono); font-size: .76rem; background: rgba(10,8,18,.8); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.pill.pilot { border-color: var(--hot); color: var(--hot); }
.pill.queued { border-style: dashed; }
.pill.inv { border-color: var(--gold); color: var(--gold); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { border-color: #4a4268; }
.btn kbd { font-family: var(--f-mono); font-size: .68rem; opacity: .65; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.btn.special { border-color: var(--gold); color: var(--gold); padding: 6px 12px; font-size: .82rem; }
.btn.special:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); color: var(--mute); }
.btn.special.live { background: var(--gold); color: #1a1405; }
.btn.small { padding: 6px 10px; font-size: .8rem; }
.loadout { display: flex; flex-wrap: wrap; gap: 6px; max-width: min(760px, 100%); }
.chip { --c: #888; display: flex; align-items: center; gap: 6px; background: rgba(16,14,24,.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .76rem; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font-weight: 600; }
.chip span { font-family: var(--f-mono); color: var(--mute); font-size: .68rem; }
.chip.on { border-color: var(--c); }
.chip.queued i, .chip.leaving i { animation: flick .5s steps(2) infinite; }
.chip.dropped { border-color: #6b2f42; }
.chip.dropped i { background: var(--hot); animation: flick .2s steps(2) infinite; }
.chip.gear { border-style: dashed; }
.chip.empty { color: var(--mute); border-style: dashed; }
.pips { display: flex; gap: 4px; align-items: center; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }
.pips i.on.down { background: var(--hot); }
.touchpad { display: none; gap: 8px; }
@media (pointer: coarse) { .touchpad { display: flex; } }
@keyframes flick { 50% { opacity: .1; } }
.banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 700; font-size: clamp(1.2rem, 4vw, 2rem); letter-spacing: .05em; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 0 18px rgba(255,92,138,.6); max-width: calc(100% - 32px); }
.banner.show { opacity: 1; }
.banner small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .9rem; color: var(--mute); text-shadow: none; letter-spacing: 0; }

/* Screens */
.screen { position: absolute; inset: 0; display: grid; place-items: center; overflow-y: auto; background: rgba(10,8,18,.72); backdrop-filter: blur(2px);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { width: min(980px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.panel h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.panel h1 span { color: var(--gold); }
.panel h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.panel h3 { font-family: var(--f-display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0; }
.panel p { margin: 0; color: var(--mute); max-width: 68ch; }
.panel p b { color: var(--ink); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.cols > * { min-width: 0; }
.stat { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--f-mono); font-size: .8rem; color: var(--mute); }
.stat b { color: var(--ink); font-weight: 500; }
.list { display: grid; gap: 6px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2); }
.item > div { min-width: 0; }
.item b { font-family: var(--f-display); font-size: .92rem; display: block; }
.item span { font-size: .78rem; color: var(--mute); display: block; }
.item.own { border-color: #2f5c48; }
.item.ban { border-color: #6b2f42; }
.item .btn { flex: none; }
.perks { display: grid; gap: 4px; font-size: .82rem; color: var(--mute); }
.perks .got { color: var(--ink); }
.perks .got::before { content: "■ "; color: var(--gold); }
.perks .next::before { content: "□ "; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .72rem; color: var(--mute); }
.slots .grp { display: flex; align-items: center; gap: 4px; }
.slots em { font-style: normal; font-family: var(--f-mono); font-size: .66rem; letter-spacing: .04em; margin-right: 2px; }
.slots .s { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 5px; border: 1px dashed #4a4366; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: .68rem; color: #6f6890; }
.slots .s.full { border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); color: #fff; }
.card { --c: #888; all: unset; box-sizing: border-box; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card:hover, .card:focus-visible { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 22px -8px var(--c); }
.card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card .tag { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .08em; color: var(--c); border: 1px solid var(--c); border-radius: 5px; padding: 1px 6px; justify-self: start; }
.card b { font-family: var(--f-display); font-size: 1.15rem; }
.card .music { font-size: .85rem; color: var(--ink); }
.card .fx { font-size: .82rem; color: var(--mute); }
.card .warn { font-size: .78rem; color: var(--hot); }
.card .slot { font-family: var(--f-mono); font-size: .7rem; color: var(--mute); }
.card kbd { font-family: var(--f-mono); font-size: .68rem; color: var(--mute); justify-self: end; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: .86rem; color: var(--mute); }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.keys { font-size: .82rem; color: var(--mute); display: grid; gap: 3px; }
.keys kbd { font-family: var(--f-mono); font-size: .7rem; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.summary-big { font-family: var(--f-display); font-size: 2rem; font-weight: 700; color: var(--gold); }
.lvup { color: var(--gold); font-weight: 600; }
@media (max-width: 560px) {
  .hp { min-width: 0; width: min(260px, 60vw); }
  .map i { width: 11px; height: 11px; font-size: 0; }
  .chip span { display: none; }
  .chip.empty { display: none; }
  .hud.top { gap: 6px; }
  .mid { flex: none; }
  .mid .map { display: none; }
  .mid .room { font-size: .78rem; }
  .btn.special { padding: 4px 8px; font-size: .72rem; }
  .pill { font-size: .68rem; padding: 3px 8px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .chip i { animation: none !important; } }

/* ===== UI pass (2026-11-23): corner HUD, band strip, radial cooldowns, stacked notices, build sheet, options =====
   Conventions borrowed from Hades / Dead Cells (corner HUD, radial cooldowns), Balatro (one colour per meaning),
   Vampire Survivors (effect options), Slay the Spire (always-visible path) and mobile thumb-zone norms. */
html { font-size: calc(16px * var(--ui, 1)); }
.hud.top { padding-top: max(10px, env(safe-area-inset-top, 0px)); grid-template-columns: auto 1fr auto; align-items: start; }
.hud.bottom { padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.tl { display: grid; gap: 6px; justify-items: start; }
.tlrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl .room { white-space: nowrap; font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; font-size: .9rem; }
.tr { display: flex; gap: 8px; align-items: center; justify-self: end; }
.tr .pips span { font-family: var(--f-mono); font-size: .74rem; color: var(--gold); margin-left: 4px; }
.rbtn { --rc: var(--line); --p: 1; position: relative; border: none; border-radius: 50%; padding: 0; display: grid; place-items: center; align-content: center;
  background: conic-gradient(var(--rc) calc(var(--p) * 1turn), rgba(47,42,68,.9) 0); color: var(--ink); touch-action: manipulation; }
.rbtn::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #16131f; }
.rbtn > * { position: relative; }
.pausebtn { width: 2.75rem; height: 2.75rem; --rc: #4a4268; }
.pausebtn svg { width: 14px; height: 14px; }
.br { display: grid; gap: 8px; justify-items: end; }
.actions { display: flex; gap: 10px; align-items: flex-end; }
.rbtn.special { width: 4.5rem; height: 4.5rem; --rc: var(--gold); }
.rbtn.special b { font-family: var(--f-display); font-size: 1rem; line-height: 1; }
.rbtn.special span { font-size: .68rem; color: var(--mute); line-height: 1.1; }
.rbtn.special kbd { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: .66rem; background: #16131f; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--mute); }
.rbtn.special:disabled { cursor: default; --rc: #3a3452; }
.rbtn.special:disabled b { color: var(--mute); }
.rbtn.special.charging b { color: var(--gold); opacity: .8; }
.rbtn.special.ready { box-shadow: 0 0 0 2px var(--gold), 0 0 22px -2px var(--gold); animation: ready 1s ease-in-out infinite alternate; }
.rbtn.special.ready b { color: var(--gold); }
.rbtn.special.live::before { background: var(--gold); }
.rbtn.special.live b, .rbtn.special.live span { color: #1a1405; }
@keyframes ready { from { box-shadow: 0 0 0 2px var(--gold), 0 0 10px -4px var(--gold); } to { box-shadow: 0 0 0 2px var(--gold), 0 0 26px 0 var(--gold); } }
.rbtn.dash { display: none; width: 3.5rem; height: 3.5rem; --rc: var(--hot); font-weight: 600; font-size: .8rem; }
@media (pointer: coarse) { .rbtn.dash { display: grid; } kbd { display: none !important; } }
.sets { display: grid; gap: 4px; justify-items: end; }
.setrow { --c: #888; display: flex; align-items: center; gap: 8px; background: rgba(16,14,24,.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .74rem; white-space: nowrap; }
.setrow.full { border-color: var(--c); }
.setrow b { font-weight: 600; color: var(--c); }
.setrow .sp { display: flex; gap: 2px; }
.setrow .sp i { width: 7px; height: 10px; border-radius: 2px; background: var(--line); }
.setrow .sp i.on { background: var(--c); }
.setrow .sp i.tier { box-shadow: 0 -2px 0 0 #fff8; }
.setrow span { color: var(--mute); font-family: var(--f-mono); font-size: .68rem; }
.band { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; max-width: min(30rem, calc(100vw - 7.5rem)); }
.tile { --c: #888; position: relative; width: 3.5rem; height: 3.1rem; border-radius: 9px; background: rgba(16,14,24,.9); border: 1.5px solid var(--c); display: grid; place-items: center; align-content: center; gap: 4px; }
.tile b { font-family: var(--f-display); font-weight: 700; font-size: .72rem; color: var(--c); letter-spacing: .02em; max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap; padding: 0 2px; }
.tile .lv { display: flex; gap: 3px; }
.tile .lv i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.tile .lv i.on { background: var(--c); }
.tile.open { border: 1.5px dashed #4a4366; }
.tile.open b { color: #6f6890; font-weight: 500; }
.tile.queued, .tile.leaving { animation: flick .5s steps(2) infinite; }
.tile.down { border-color: var(--hot); }
.tile.down > b, .tile.down > .lv { opacity: .3; }
.tile .cd { position: absolute; inset: 0; background: rgba(16,14,24,.88); display: grid; place-items: center; align-content: center; border-radius: 8px; font-family: var(--f-mono); font-size: .9rem; color: var(--hot); line-height: 1; }
.tile .cd small { display: block; font-size: .6rem; color: var(--mute); }
.tile.lens { width: 2.6rem; height: 2.6rem; border-radius: 50%; gap: 0; }
.tile.lens.open { border-style: dashed; }
.band .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
.hp { min-width: 16rem; }
.bar.hull { position: relative; height: 14px; border-radius: 7px; }
.bar.hull u { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; opacity: .5; text-decoration: none; }
.bar.hull i { position: relative; transition: none; }
.gong { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.gong i { display: block; height: 100%; width: 0; background: var(--gold); }
.gong.on i { box-shadow: 0 0 8px var(--gold); }
.hp.low { border-color: var(--hot); animation: lowhp .6s ease-in-out infinite alternate; }
.hp.low #hpTxt { color: var(--hot); }
@keyframes lowhp { from { box-shadow: 0 0 0 0 rgba(255,92,138,0); } to { box-shadow: 0 0 18px 0 rgba(255,92,138,.55); } }
.calm .hp.low, .calm .rbtn.special.ready, .calm .tile.queued, .calm .tile.leaving { animation: none; }
.vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; box-shadow: inset 0 0 120px 30px rgba(255,40,70,.55); }
.notices { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(560px, calc(100% - 32px)); }
.note { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.05rem, 3.4vw, 1.6rem); letter-spacing: .05em; text-align: center; text-shadow: 0 0 18px rgba(255,92,138,.6), 0 1px 3px #000; animation: notein .25s ease-out; transition: opacity .4s; }
.note small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .85rem; color: var(--mute); text-shadow: 0 1px 3px #000; letter-spacing: 0; }
.note.out { opacity: 0; }
.note + .note { font-size: clamp(.9rem, 2.6vw, 1.15rem); opacity: .85; }
@keyframes notein { from { transform: translateY(-8px); opacity: 0; } }
.bosshud { top: calc(5rem + env(safe-area-inset-top, 0px)); }
@media (min-width: 1100px) { .bosshud { top: calc(14px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 700px)); } }
@media (max-width: 640px) { .bosshud { top: calc(4.6rem + env(safe-area-inset-top, 0px)); } }
@media (pointer: coarse) and (orientation: landscape) { .hud.bottom .left { margin-bottom: 2.5rem; } }
/* Reward and pick cards: colour band on top, lift on hover, changed numbers highlighted, skip card quieter */
.card { position: relative; overflow: hidden; transition: transform .12s ease-out, box-shadow .12s, border-color .12s; padding-top: 18px; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--c); }
.card:hover, .card:focus-visible { transform: translateY(-4px); }
.card .fx em, .card .music em { font-style: normal; font-weight: 600; color: var(--gold); }
.card .lvl { display: flex; gap: 4px; align-items: center; font-family: var(--f-mono); font-size: .68rem; color: var(--mute); }
.card .lvl i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--c); }
.card .lvl i.on { background: var(--c); }
.card .lvl i.new { background: #fff; border-color: #fff; box-shadow: 0 0 6px var(--c); }
.card.skip { background: transparent; border-style: dashed; }
.card.skip::before { opacity: .35; }
.card.skip b { font-size: 1rem; }
.card .reward { font-size: .82rem; color: var(--ink); }

const byId = id => STEMS.find(s => s.id === id);
const layers = () => STEMS.filter(s => !s.base && !s.pilot);
function build() {
  const master = new Tone.Volume(-6);
  const comp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.2 });
  const limiter = new Tone.Limiter(-1);
  const meter = new Tone.Meter({ smoothing: 0.6 });
  const slowLP = new Tone.Filter({ type: "lowpass", frequency: 20000, rolloff: -24 });
  // Volume settings: music and effects each get their own gain ahead of the shared slow-mo filter, compressor and limiter
  const musicG = new Tone.Gain(1), sfxG = new Tone.Gain(1);
  master.chain(musicG, slowLP, comp, limiter, Tone.Destination);
  sfxG.connect(slowLP);
  limiter.connect(meter);
  const reverb = new Tone.Reverb({ decay: 2.8, preDelay: 0.02, wet: 1 }).connect(master);
  const duckBus = new Tone.Gain(1).connect(master);   // other layers duck under the full-set bonus
  const beatBus = new Tone.Gain(1).connect(master);   // EDM beat steps aside for the full-set bonus
  const pumpBus = new Tone.Gain(1).connect(duckBus);

  for (const s of STEMS) {
    s.fader = new Tone.Gain(s.wanted ? 1 : 0);
    s.vol = new Tone.Volume(s.db);
    s.fader.connect(s.vol);
    s.vol.connect(s.pump ? pumpBus : s.base ? beatBus : s.pilot ? master : duckBus);
    if (s.send) { s.sendG = new Tone.Gain(s.send); s.vol.connect(s.sendG); s.sendG.connect(reverb); }
    s.gate = s.wanted;
  }
  const F = id => byId(id).fader;
  const n = { master, meter, reverb, pumpBus, duckBus, beatBus, slowLP, musicG, sfxG };
  // Shred special: riser for the slow-motion windup, two solo guitars for the solo or the duel
  const riserBP = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 2 }).connect(comp);
  n.riserBP = riserBP;
  n.riser = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 1, decay: 0.05, sustain: 1, release: 0.1 } }).connect(riserBP);
  n.riser.volume.value = -14;
  // Gear sets: one bus per set (cohesion gain + muffle filter), instruments built by each set
  n.setMaster = master;   // sets are built lazily by ensureSet() when their first piece is equipped
  for (const id of []) {
    const bus = null, lp = null, I = {};
    RT[id] = { bus, lp, I };
  }

  // Base beat
  n.kick = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.38, sustain: 0, release: 0.05 } }).connect(F("beat"));
  const hatHP = new Tone.Filter({ type: "highpass", frequency: 8000 }).connect(F("beat"));
  n.hat = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.035, sustain: 0 } }).connect(hatHP);
  n.ohat = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.002, decay: 0.16, sustain: 0 } }).connect(hatHP);
  n.hat.volume.value = -8; n.ohat.volume.value = -9;

  // Flute (Sword)
  const vib = new Tone.Vibrato(5.2, 0.07).connect(F("flute"));
  n.flute = new Tone.Synth({ oscillator: { type: "custom", partials: [1, 0.32, 0.12, 0.05, 0.02] }, envelope: { attack: 0.04, decay: 0.15, sustain: 0.75, release: 0.18 }, portamento: 0.012 }).connect(vib);
  const breathBP = new Tone.Filter({ type: "bandpass", frequency: 2400, Q: 1.1 }).connect(F("flute"));
  n.breath = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.09, sustain: 0.05, release: 0.05 } }).connect(breathBP);
  n.breath.volume.value = -20;

  // Dubstep drop (Plasma Blade)
  n.wobF = new Tone.Filter({ type: "lowpass", frequency: 200, Q: 7, rolloff: -24 });
  const dist = new Tone.Distortion(0.45);
  n.wobF.chain(dist, F("drop"));
  n.wob = new Tone.Synth({ oscillator: { type: "fatsawtooth", count: 3, spread: 28 }, envelope: { attack: 0.005, decay: 0.05, sustain: 1, release: 0.06 } }).connect(n.wobF);
  n.wob.volume.value = -4;
  n.sub = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.05, sustain: 1, release: 0.06 } }).connect(F("drop"));
  n.sub.volume.value = -5;
  const snHP = new Tone.Filter({ type: "highpass", frequency: 900 }).connect(F("drop"));
  n.dsnare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.22, sustain: 0 } }).connect(snHP);
  n.dsnBody = new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 2, envelope: { attack: 0.001, decay: 0.12, sustain: 0 } }).connect(F("drop"));
  n.dsnBody.volume.value = -4;

  // Taiko (War Hammer)
  n.taiko = new Tone.MembraneSynth({ pitchDecay: 0.08, octaves: 2.5, envelope: { attack: 0.002, decay: 0.7, sustain: 0, release: 0.3 } }).connect(F("taiko"));
  n.rim = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 1.5, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).connect(F("taiko"));
  n.rim.volume.value = -10;

  // Arp (Lightning Rune)
  const arpDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.28, wet: 0.22 }).connect(F("arp"));
  n.arp = new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, filter: { Q: 3, type: "lowpass", rolloff: -24 },
    envelope: { attack: 0.002, decay: 0.14, sustain: 0.15, release: 0.08 },
    filterEnvelope: { attack: 0.001, decay: 0.12, sustain: 0.1, baseFrequency: 700, octaves: 3 } }).connect(arpDelay);

  // Pads (Guardian Shield)
  const padLP = new Tone.Filter({ type: "lowpass", frequency: 1500 }).connect(F("pads"));
  n.pads = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 3, spread: 30 }, envelope: { attack: 0.3, decay: 0.3, sustain: 0.8, release: 1.2 } }).connect(padLP);
  n.pads.maxPolyphony = 12; n.pads.volume.value = -8;
  // Gong (Guardian Shield): inharmonic FM strike, a higher shimmer partial and a soft mallet thump
  const gongLP = new Tone.Filter({ type: "lowpass", frequency: 5200 }).connect(F("pads"));
  n.gong = new Tone.FMSynth({ harmonicity: 1.41, modulationIndex: 9, oscillator: { type: "sine" }, modulation: { type: "sine" },
    envelope: { attack: 0.003, decay: 4, sustain: 0, release: 2 }, modulationEnvelope: { attack: 0.003, decay: 1.6, sustain: 0.15, release: 1.5 } }).connect(gongLP);
  n.gong2 = new Tone.FMSynth({ harmonicity: 2.76, modulationIndex: 5, envelope: { attack: 0.004, decay: 2.6, sustain: 0, release: 1.5 },
    modulationEnvelope: { attack: 0.004, decay: 1, sustain: 0.1, release: 1 } }).connect(gongLP);
  n.gong2.volume.value = -9;
  n.mallet = new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 2, envelope: { attack: 0.002, decay: 0.5, sustain: 0 } }).connect(F("pads"));
  n.mallet.volume.value = -8;

  // Funk bass (Twin Daggers)
  n.funk = new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, filter: { Q: 2, type: "lowpass", rolloff: -24 },
    envelope: { attack: 0.003, decay: 0.22, sustain: 0.35, release: 0.06 },
    filterEnvelope: { attack: 0.002, decay: 0.14, sustain: 0.25, baseFrequency: 160, octaves: 3.6 } }).connect(F("funk"));

  // Choir (Heart Charm): saw voices through "ah" formant filters
  const formSum = new Tone.Gain(3.2).connect(F("choir"));
  const voxVib = new Tone.Vibrato(4.6, 0.05);
  [[800, 6, 1], [1150, 7, 0.55], [2900, 9, 0.22]].forEach(([f, q, g]) => {
    const bp = new Tone.Filter({ type: "bandpass", frequency: f, Q: q });
    const gg = new Tone.Gain(g);
    voxVib.connect(bp); bp.connect(gg); gg.connect(formSum);
  });
  n.choir = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 2, spread: 14 }, envelope: { attack: 0.45, decay: 0.2, sustain: 0.9, release: 1.4 } }).connect(voxVib);
  n.choir.maxPolyphony = 10;

  // Strings (Comet Bow)
  const strLP = new Tone.Filter({ type: "lowpass", frequency: 2600 }).connect(F("strings"));
  n.str = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 3, spread: 18 }, envelope: { attack: 0.012, decay: 0.16, sustain: 0.35, release: 0.14 } }).connect(strLP);
  n.str.maxPolyphony = 6;

  // Rock kit (Pilot)
  n.rkick = new Tone.MembraneSynth({ pitchDecay: 0.025, octaves: 4, envelope: { attack: 0.001, decay: 0.26, sustain: 0 } }).connect(F("rock"));
  const rsHP = new Tone.Filter({ type: "highpass", frequency: 1400 }).connect(F("rock"));
  n.rsnare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.17, sustain: 0 } }).connect(rsHP);
  n.rsnBody = new Tone.MembraneSynth({ pitchDecay: 0.015, octaves: 1.5, envelope: { attack: 0.001, decay: 0.1, sustain: 0 } }).connect(F("rock"));
  n.rsnBody.volume.value = -3;
  const rhHP = new Tone.Filter({ type: "highpass", frequency: 9000 }).connect(F("rock"));
  n.rhat = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.045, sustain: 0 } }).connect(rhHP);
  n.rhat.volume.value = -6;
  const crHP = new Tone.Filter({ type: "highpass", frequency: 4500 }).connect(F("rock"));
  n.crash = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.002, decay: 1.6, sustain: 0 } }).connect(crHP);
  n.crash.volume.value = -9;

  // Hit sound effect (not a layer)
  const hitBP = new Tone.Filter({ type: "bandpass", frequency: 1800, Q: 0.8 }).connect(sfxG);
  n.hitfx = new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).connect(hitBP);
  n.hitfx.volume.value = -6;

  n.loop = new Tone.Loop(tick, "16n").start(0);
  return n;
}

// =====================================================================
// Starter sets: one per pilot. Knight = rock and roll, Ranger = woodwinds and hand percussion,
// Mage = wonky, mystical bells and theremin. All original parts over the same Am F C G loop.
// =====================================================================
const STARTER = { kn: "knight", rg: "ranger", mg: "mage" };
const PENTA = [0, 3, 5, 7, 10];
const pent = (root, i) => root + PENTA[((i % 5) + 5) % 5] + 12 * Math.floor(i / 5);
const nn = m => Tone.Frequency(m, "midi").toNote();

// ---------------- Knight: rock and roll ----------------
const KN_LEAD = melody([
  [16,"E5",4],[20,"D5",2],[22,"C5",2],[24,"A4",8],
  [48,"A4",2],[50,"C5",2],[52,"D5",2],[54,"E5",4],[58,"G5",2],[60,"E5",4],
  [80,"C5",2],[82,"D5",2],[84,"E5",4],[88,"G5",4],[92,"A5",4],
  [112,"A5",3],[115,"G5",1],[116,"E5",2],[118,"D5",2],[120,"C5",2],[122,"A4",6],
]);
defineSet({
  id: "kn", name: "Knight", color: "#ffb347", key: "K",
  loose: "Loose: a garage band warming up", tight: "Locked in: full rock and roll",
  pieces: [
    { id: "kn-greaves",  body: "legs",  covers: ["drums"], item: "Squire Greaves",   member: "Rock drummer",  adds: "backbeat drums" },
    { id: "kn-belt",     body: "waist", covers: ["bass"],  item: "Buckle Belt",      member: "Bass player",   adds: "boogie bass line" },
    { id: "kn-gauntlets",body: "arms",  covers: ["piano"], item: "Boogie Gauntlets", member: "Piano player",  adds: "honky-tonk piano stabs" },
    { id: "kn-tabard",   body: "back",  covers: ["organ"], item: "Organ Tabard",     member: "Organist",      adds: "held organ chords" },
    { id: "kn-helm",     body: "head",  covers: ["vox"],   item: "Great Helm",       member: "Backing vocals", adds: "“hey!” shouts and “aah” backing" },
    { id: "kn-greatsword", hands: 2, covers: ["rhythm", "lead"], item: "Knight's Greatsword", member: "Rhythm + lead guitar", adds: "shuffle riff and pentatonic licks", note: "Two-handed · counts as 2" },
    { id: "kn-sword",    hands: 1, covers: ["rhythm"], item: "Arming Sword", member: "Rhythm guitar", adds: "shuffle riff", note: "One-handed" },
    { id: "kn-shield",   hands: 1, covers: ["lead"],   item: "Kite Shield",  member: "Lead guitar",   adds: "pentatonic licks", note: "One-handed" },
  ],
  special: {
    name: "Rock Anthem", duel: "Sword and shield duel", two: "kn-greatsword", pair: ["kn-sword", "kn-shield"], duelOffset: 0,
    voice:  { osc: "sawtooth", dist: 0.7, lp: 3600, delay: "8n", wet: 0.18, vibF: 5.5, vibD: 0.03, port: 0.03, vol: -14 },
    voiceB: { osc: "square", dist: 0.5, lp: 2600, delay: "8n", wet: 0.18, vibF: 5, vibD: 0.02, port: 0.02, vol: -15 },
    // pentatonic runs, bends, a fast descent, tremolo picking, then a climb to the top
    line(sb, c) {
      const root = mid(c.arp[0]) - 12, out = [];
      if (sb === 0) { for (let i = 0; i < 16; i++) out.push(pent(root + 12, [0,1,2,3,4,5,4,3,2,3,4,5,6,5,4,3][i])); return { notes: out, sub: 1 }; }
      if (sb === 1) { for (let i = 0; i < 16; i++) out.push(i % 4 === 3 ? root + 24 : root + 22 + (i % 2) * 2); return { notes: out, sub: 1 }; }
      if (sb === 2) { for (let i = 0; i < 16; i++) out.push(pent(root + 12, 10 - i)); return { notes: out, sub: 1 }; }
      if (sb === 3) { for (let i = 0; i < 32; i++) out.push(i % 2 ? root + 27 : root + 24); return { notes: out, sub: 2 }; }
      for (let i = 0; i < 32; i++) out.push(pent(root + 12, Math.floor(i * 10 / 31)));
      return { notes: out, sub: 2 };
    },
  },
  build(out) {
    const I = {};
    I.kick = new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 4, envelope: { attack: 0.001, decay: 0.28, sustain: 0 } }).connect(out);
    const snBP = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.8 }).connect(out);
    I.snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.14, sustain: 0 } }).connect(snBP);
    I.ride = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.09, sustain: 0 } }).connect(new Tone.Filter({ type: "highpass", frequency: 7000 }).connect(out));   // cheaper than a MetalSynth
    I.ride.volume.value = -20;
    I.bass = new Tone.MonoSynth({ oscillator: { type: "triangle" }, filter: { Q: 1, type: "lowpass" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.5, release: 0.05 },
      filterEnvelope: { attack: 0.002, decay: 0.12, sustain: 0.3, baseFrequency: 300, octaves: 2 } }).connect(out);
    I.bass.volume.value = -4;
    I.piano = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 3, envelope: { attack: 0.002, decay: 0.35, sustain: 0.05, release: 0.2 }, modulationEnvelope: { attack: 0.002, decay: 0.2, sustain: 0 } }).connect(out);
    I.piano.maxPolyphony = 8; I.piano.volume.value = -15;
    const rot = new Tone.Tremolo(6, 0.35).start(); rot.connect(out);
    I.organ = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "custom", partials: [1, 0.6, 0.45, 0.25, 0.15, 0.1] }, envelope: { attack: 0.03, decay: 0.1, sustain: 0.9, release: 0.3 } }).connect(rot);
    I.organ.maxPolyphony = 8; I.organ.volume.value = -19;
    const voxIn = new Tone.Gain(1);
    I.voxF = mkFormant(voxIn, VOWEL.a, new Tone.Gain(4).connect(out));
    I.vox = new Tone.Synth({ oscillator: { type: "fatsawtooth", count: 3, spread: 25 }, envelope: { attack: 0.01, decay: 0.15, sustain: 0.6, release: 0.2 } }).connect(voxIn);
    I.vox.volume.value = -9;
    const amp = new Tone.Distortion({ distortion: 0.75, oversample: "none" }), cab = new Tone.Filter({ type: "lowpass", frequency: 3000 });
    amp.chain(cab, out);
    I.rhythm = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sawtooth" }, envelope: { attack: 0.002, decay: 0.12, sustain: 0.35, release: 0.05 } }).connect(amp);
    I.rhythm.maxPolyphony = 6; I.rhythm.volume.value = -22;
    const leadAmp = new Tone.Distortion({ distortion: 0.8, oversample: "none" });
    leadAmp.chain(new Tone.Filter({ type: "lowpass", frequency: 3800 }), new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.25, wet: 0.2 }), out);
    I.lead = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.7, release: 0.15 }, portamento: 0.03 }).connect(new Tone.Vibrato(5.5, 0.04).connect(leadAmp));
    I.lead.volume.value = -20;
    return I;
  },
  play(I, x) {
    const { inBar, bar, step, c, d, time, has, tight, pilot, full, solo, soloStart } = x;
    const root = c.bass[1], m = mid(root);
    if (has("drums")) {
      if (tight ? (inBar === 0 || inBar === 8 || (pilot && inBar === 10)) : inBar === 0) I.kick.triggerAttackRelease("C1", "8n", time, 1);
      if (tight ? (inBar === 4 || inBar === 12) : inBar === 8) I.snare.triggerAttackRelease(0.14, time, 0.9);
      if (tight && inBar % 2 === 0) I.ride.triggerAttackRelease("16n", time, inBar % 4 === 0 ? 0.6 : 0.35);
    }
    if (has("bass")) {   // boogie: root, root, fifth, fifth, sixth, sixth, fifth, fifth
      const walk = [0, 0, 7, 7, 9, 9, 7, 7];
      if (tight && inBar % 2 === 0) I.bass.triggerAttackRelease(nn(m - 12 + walk[inBar / 2]), d * 1.7, time, inBar % 4 === 0 ? 1 : 0.75);
      else if (!tight && inBar % 8 === 0) I.bass.triggerAttackRelease(nn(m - 12), d * 7, time, 0.85);
    }
    if (has("piano")) {
      const ch = c.pad.map(up12);
      if (tight && (inBar === 2 || inBar === 6 || inBar === 10 || inBar === 14 || (pilot && inBar === 15))) I.piano.triggerAttackRelease(ch, d * 0.9, time, 0.7);
      else if (!tight && inBar === 0) I.piano.triggerAttackRelease(ch, d * 3, time, 0.6);
    }
    if (has("organ") && inBar === 0 && (tight || bar % 2 === 0)) I.organ.triggerAttackRelease(c.pad, d * (tight ? 15.5 : 31), time, 0.5);
    if (has("vox") && !solo) {
      if (step % 32 === 28) I.vox.triggerAttackRelease(c.choir[1], d * 1.2, time, 0.9);   // "hey!"
      if ((tight || full) && inBar === 0 && bar >= 4) I.vox.triggerAttackRelease(c.choir[0], d * 7, time, 0.5);   // "aah"
    }
    if (has("rhythm")) {   // shuffle: fifth then sixth over the root
      if (tight && inBar % 2 === 0) { const top = inBar % 4 === 0 ? 7 : 9; I.rhythm.triggerAttackRelease([nn(m), nn(m + top)], d * 1.4, time, 0.8); }
      else if (!tight && inBar === 0) I.rhythm.triggerAttackRelease([nn(m), nn(m + 7), nn(m + 12)], d * 6, time, 0.7);
    }
    if (has("lead") && !solo) {
      const v = KN_LEAD.get(step), answer = bar % 4 === 3;
      if (v && (answer || tight)) I.lead.triggerAttackRelease(v[1], v[2] * d * 0.95, time, 0.85);
    }
    if (soloStart && !(has("drums") && tight)) I.snare.triggerAttackRelease(0.2, time, 1);
  },
});

  const d = s16();

    for (const id in SETS) setNow[id] = membersOf(id);
